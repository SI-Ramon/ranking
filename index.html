<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ranking - Guardiões</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin: 0;
  min-height: 100vh;
  color: #fff;
  background: linear-gradient(rgba(12,25,30,0.85), rgba(12,25,30,0.85));
}

/* LOGIN */
#loginBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
#loginBox input{
  padding:10px;
  margin:10px;
  border-radius:8px;
  border:none;
}
#loginBox button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:#00c853;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

/* CONTEÚDO ORIGINAL */
.wrap{
  max-width:1000px;
  margin:auto;
  padding:30px;
}

.header {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.club-emblem{
  width:60px;
}

.podium{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  background:rgba(255,255,255,.1);
  padding:20px;
  border-radius:10px;
  text-align:center;
}

table{
  width:100%;
  margin-top:20px;
}
</style>
</head>

<body>

<!-- 🔒 LOGIN -->
<div id="loginBox">
  <h2>🔒 Acesso Restrito</h2>
  <input type="password" id="senha" placeholder="Digite a senha">
  <button onclick="verificar()">Entrar</button>
</div>

<!-- 🔓 CONTEÚDO -->
<div id="conteudo" style="display:none;">

<div class="wrap">

  <div class="header">
    <img class="club-emblem" src="https://raw.githubusercontent.com/SI-Ramon/ranking/main/ranking/img/GUARDIOES.png">
    <h1>Ranking - Guardiões</h1>
  </div>

  <div class="podium" id="podium"></div>

  <h2>📋 Ranking Completo</h2>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Pontos</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>
</div>

<script>
// 🔐 LOGIN
function verificar(){
  const senha = document.getElementById("senha").value;

  if(senha === "AmelhorAventuraDBV2026"){
    localStorage.setItem("acesso","ok");
    liberar();
  } else {
    alert("Senha incorreta!");
  }
}

function liberar(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("conteudo").style.display = "block";
}

if(localStorage.getItem("acesso") === "ok"){
  liberar();
}

// 📊 DADOS (SUA PLANILHA)
const SHEET_ID = "1XSBKPMg4nlzAJpACvZ5hCumqOyFPFIIRqV60gghP43E";
const SHEET_NAME = "RANKING";

function parseGViz(text){
  const start = text.indexOf("{");
  const end = text.lastIndexOf("}");
  return JSON.parse(text.substring(start, end + 1));
}

async function load(){
  const query = encodeURIComponent("select A, B where A is not null order by B desc");
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${SHEET_NAME}&tq=${query}`;

  const res = await fetch(url);
  const text = await res.text();
  const data = parseGViz(text);

  const rows = data.table.rows.map(r => ({
    nome: r.c[0].v,
    pontos: r.c[1].v
  }));

  // PODIUM
  const podium = document.getElementById("podium");
  podium.innerHTML = "";

  rows.slice(0,3).forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h3>${i+1}º</h3><strong>${p.nome}</strong><p>${p.pontos} pts</p>`;
    podium.appendChild(div);
  });

  // TABELA
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  rows.forEach((p,i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i+1}</td><td>${p.nome}</td><td>${p.pontos}</td>`;
    tbody.appendChild(tr);
  });
}

load();
</script>

</body>
</html>
