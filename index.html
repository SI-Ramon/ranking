<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ranking - Guardiões</title>

<style>
/* ===== BODY / BACKGROUND ===== */
body{
  font-family: Arial, sans-serif;
  margin: 0;
  min-height: 100vh;
  color: #fff;

  background-image:
    linear-gradient(rgba(12,25,30,0.60), rgba(12,25,30,0.60)),
    url('https://raw.githubusercontent.com/SI-Ramon/ranking/main/ranking/img/desbravador.webp');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
@media (max-width: 480px){
  body{
    background-attachment: scroll;
    background-position: center top;
  }
}

/* ===== layout ===== */
.wrap{
  max-width:1000px;
  margin:auto;
  padding:30px;
  padding-bottom:110px;
}

/* header com emblema + título */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 8px;
}
h1.title {
  font-size: 28px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  color: #fff;
}

/* emblema do clube */
.club-emblem {
  width: 60px;
  height: 60px;
  object-fit: contain;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.08);
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  display: inline-block;
  position: relative;
  pointer-events: none;
  -webkit-user-drag: none;
  user-drag: none;
}

.header.no-emblem {
  justify-content: center;
}
.header.no-emblem .club-emblem {
  display: none;
}

/* ===== podium grid ===== */
.podium{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
  margin: 18px 0 40px;
  justify-items:center;
}

/* ===== card ===== */
.card{
  position: relative;
  overflow: visible;
  background: rgba(255,255,255,.08);
  padding: 100px 20px 20px;
  border-radius: 15px;
  text-align: center;
  min-height: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  box-sizing: border-box;
  transition: transform .18s ease;
}
.card:hover{ transform: translateY(-6px); }

.gold { background: rgba(255,215,0,.34); }
.silver { background: rgba(192,192,192,.28); }
.bronze { background: rgba(205,127,50,.28); }

/* ===== avatares ===== */
.avatar-container {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.12);
  z-index: 2;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
  overflow: hidden;
  pointer-events: none;
}

.avatar-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  object-fit: cover;
  pointer-events: none;
}

.avatar-sm-container {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.15);
  overflow: hidden;
  flex-shrink: 0;
  pointer-events: none;
}

.avatar-sm-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  object-fit: cover;
  pointer-events: none;
}

.protection-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  z-index: 15;
  pointer-events: none;
}

/* ===== coroa ===== */
.crown{
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%);
  font-size:32px;
  z-index:3;
  pointer-events:none;
  text-shadow:0 3px 8px rgba(0,0,0,.6);
}

/* ===== tabela ===== */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:8px;
}
th,td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
th{ text-align:left; }

.page-footer{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  text-align: center;
  padding: 12px;
}

/* 🔒 LOGIN (NÃO ALTERA SEU LAYOUT) */
#loginBox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.95);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
#loginBox input{
  padding:10px;
  border-radius:8px;
  border:none;
}
#loginBox button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:#00c853;
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- 🔒 LOGIN -->
<div id="loginBox">
  <h2>🔒 Acesso Restrito</h2>
  <input type="password" id="senha" placeholder="Digite a senha">
  <button onclick="verificar()">Entrar</button>
</div>

<!-- ===== SEU SITE ORIGINAL (INALTERADO) ===== -->
<div class="wrap">
  <div id="headerWrap" class="header">
    <img id="clubEmblem" class="club-emblem" src="" />
    <h1 class="title">Ranking - Guardiões</h1>
  </div>

  <div class="podium" id="podium"></div>

  <h2>📋 Ranking Completo</h2>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Desbravador</th>
        <th>Pontos</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
// 🔐 LOGIN
function verificar(){
  const senha = document.getElementById("senha").value;

  if(senha === "AmelhorAventuraDBV2026"){
    localStorage.setItem("acesso","ok");
    document.getElementById("loginBox").style.display = "none";
  } else {
    alert("Senha incorreta!");
  }
}

if(localStorage.getItem("acesso") === "ok"){
  document.getElementById("loginBox").style.display = "none";
}
</script>

</body>
</html>
